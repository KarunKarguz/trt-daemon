services:
  test:
    build:
      context: .
      target: tester
    image: trt-daemon:test
    runtime: nvidia
    command: ["/bin/true"]

  trt:
    build:
      context: .
      target: runtime
    image: trt-daemon:runtime
    runtime: nvidia
    depends_on:
      - test
    environment:
      NVIDIA_DISABLE_REQUIRE: "1"
      ENGINE_PATH: /opt/models/mobilenetv2_fp32.plan
      EXPOSE_TCP: "1"
      TCP_PORT: "8008"
    ports:
      - "8008:8008"
